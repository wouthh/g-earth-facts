name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bootstrap pinned API
        run: python3 scripts/bootstrap.py
      - name: Build and test
        run: ./mvnw -B --no-transfer-progress clean verify
      - name: Public hygiene
        run: python3 scripts/check-public.py
      - name: Synthetic Steam package/install checks
        run: python3 scripts/test-install.py
      - name: Upload extension ZIP
        uses: actions/upload-artifact@v4
        with:
          name: g-earth-facts-extension
          path: target/G-Earth-Facts-0.1.0-extension.zip
